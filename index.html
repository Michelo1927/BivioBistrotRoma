<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu — Bivio Bistrot Roma</title>
  <meta name="description" data-i18n-content="description" content="Il menu di Bivio Bistrot a Roma: cucina di stagione, carta dei vini e distillati.">
  <meta name="theme-color" content="#FEE2B3">

  <!-- Favicon: la "B" del logo -->
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">

  <!-- Font: Cormorant Garamond (titoli) + Inter (testo), in locale in assets/fonts/ (@font-face in style.css): nessuna richiesta a Google -->
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/inter-latin.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/cormorant-garamond-latin.woff2" crossorigin>

  <!-- CACHE: a ogni modifica di style.css, menu-data.js o script.js cambia la versione ?v= (data AAAAMMGG),
       altrimenti i telefoni dei clienti possono mostrare il menu vecchio dalla cache. -->
  <link rel="stylesheet" href="style.css?v=20261008j">
  <!-- Script classici (no moduli): funziona anche da file:// — l'ordine conta -->
  <script defer src="menu-data.js?v=20261008j"></script>
  <script defer src="script.js?v=20261008j"></script>
</head>
<body>
  <a class="skip-link" href="#menu" data-i18n="skip">Vai al menu</a>

  <header class="site-header" id="top" tabindex="-1">
    <!-- Barra in alto: a sinistra lo stato aperto/chiuso; a destra i link rapidi (solo icona) e la pillola della lingua -->
    <div class="site-header__bar">
      <button type="button" class="status-pill" aria-expanded="false" aria-controls="status-panel" hidden></button>
      <div class="site-header__actions">
        <a class="pill-link pill-link--icona" data-link="maps" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.400-6.500 11-6.500 11Z"/><circle cx="12" cy="10" r="2.300"/></svg><span class="visually-hidden" data-i18n="maps">Mappa</span></a>
        <a class="pill-link pill-link--icona" data-link="whatsapp" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 20l1.300-4.100A8 8 0 1 1 8.200 18.800L4 20Z"/><path d="M9.200 9.300c.2 2.800 2.700 5 5.500 5.300l1.100-1.400-2-1-.9.700a4 4 0 0 1-1.900-1.900l.7-.9-1-2-1.500 1.200Z"/></svg><span class="visually-hidden" data-i18n="whatsapp">WhatsApp</span></a>
      </div>
      <!-- Lingua: pillola con la sigla della lingua attiva; apre un menu a tendina con le lingue (script.js) -->
      <div class="lang-menu">
        <button type="button" class="lang-pill" aria-haspopup="true" aria-expanded="false" aria-controls="lang-panel" aria-label="Lingua: Italiano"><span class="lang-pill__code">IT</span><svg class="status-pill__chevron" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="lang-panel" id="lang-panel" hidden>
          <button type="button" class="lang-panel__voce" data-lang="it" lang="it">Italiano</button>
          <button type="button" class="lang-panel__voce" data-lang="en" lang="en">English</button>
        </div>
      </div>
    </div>
    <div class="status-panel" id="status-panel" hidden></div>
    <h1 class="site-header__title">
      <img class="site-header__logo" src="assets/brand/logo.png" alt="Bivio — Bistrot, vini &amp; cocktail" width="820" height="404">
    </h1>
    <p class="site-header__overline">Roma</p>
    <!-- Bordo inferiore dell'intestazione: onda + bollicine (perlage), decorativo -->
    <div class="onda" aria-hidden="true">
      <span class="onda__bolla"></span><span class="onda__bolla"></span><span class="onda__bolla"></span><span class="onda__bolla"></span><span class="onda__bolla"></span><span class="onda__bolla"></span><span class="onda__bolla"></span>
      <svg class="onda__svg" viewBox="0 0 1200 40" preserveAspectRatio="none" focusable="false"><path d="M0 24C100 10 200 5 320 7C500 10 620 34 820 32C960 30 1100 20 1200 14V40H0Z"/></svg>
    </div>
  </header>

  <!-- Navigazione sticky: tab delle sezioni + chip delle categorie (popolati da script.js) -->
  <nav class="menu-nav" aria-label="Sezioni del menu" data-i18n-aria="navLabel">
    <div class="menu-nav__inner">
      <div class="tabs" role="tablist" aria-label="Sezioni" data-i18n-aria="sections"></div>
      <div class="subnav" aria-label="Categorie" data-i18n-aria="categoriesLabel"></div>
    </div>
  </nav>

  <main id="menu" class="menu" tabindex="-1">
    <noscript><p class="menu__notice">Per visualizzare il menu è necessario abilitare JavaScript.</p></noscript>
  </main>

  <footer class="site-footer">
    <div class="hours" hidden></div>
    <address class="site-footer__contacts">
      <a data-link="maps" data-meta="address" target="_blank" rel="noopener noreferrer">Piazza Monte Grappa, 1b, 00195 Roma</a>
      <a data-meta="phone" href="tel:+393780670878">+39 378 067 0878</a>
    </address>
    <!-- Senza JavaScript resta questa frase; script.js la sostituisce con quella che contiene il link al pop-up allergeni -->
    <p class="site-footer__allergeni">Per allergie e intolleranze chiedi al nostro personale.</p>
    <p class="site-footer__legal" hidden></p>
    <p class="site-footer__copy">© <span id="year">2025</span> Bivio Bistrot · Roma</p>
  </footer>

  <!-- Modale di scelta lingua: si apre da solo al primo accesso (se non c'è una scelta esplicita). Dopo, la lingua si
       cambia dalla pillola nella barra in alto. Contenuto bilingue fisso. -->
  <dialog class="lang-modal" aria-labelledby="lang-modal-title">
    <div class="lang-modal__panel" tabindex="-1">
      <h2 class="lang-modal__title" id="lang-modal-title">
        <img class="lang-modal__logo" src="assets/brand/logo.png" alt="Bivio Bistrot" width="820" height="404">
      </h2>
      <p class="lang-modal__subtitle">Scegli la lingua · Choose your language</p>
      <div class="lang-modal__choices">
        <button type="button" class="lang-modal__btn" data-lang="it" lang="it">
          <span class="lang-modal__name">Italiano</span>
        </button>
        <button type="button" class="lang-modal__btn" data-lang="en" lang="en">
          <span class="lang-modal__name">English</span>
        </button>
      </div>
    </div>
  </dialog>

  <!-- Lightbox della galleria (contenuto gestito da script.js) -->
  <dialog class="lightbox" aria-label="Il locale" data-i18n-aria="galleryPill">
    <div class="lightbox__inner">
      <button type="button" class="lightbox__btn lightbox__close" aria-label="Chiudi" data-i18n-aria="close"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <button type="button" class="lightbox__btn lightbox__prev" aria-label="Foto precedente" data-i18n-aria="prev"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button type="button" class="lightbox__btn lightbox__next" aria-label="Foto successiva" data-i18n-aria="next"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7"/></svg></button>
      <figure class="lightbox__figure">
        <img class="lightbox__img" alt="" draggable="false">
        <figcaption class="lightbox__caption">
          <span class="lightbox__text"></span>
          <span class="lightbox__count" aria-live="polite"></span>
        </figcaption>
      </figure>
    </div>
  </dialog>

  <!-- Pop-up allergeni (contenuto costruito da script.js a ogni apertura, nella lingua corrente) -->
  <dialog class="allergen-modal" aria-labelledby="allergen-modal-title">
    <div class="allergen-modal__panel" tabindex="-1"></div>
  </dialog>

  <!-- Pop-up privacy (contenuto costruito da script.js a ogni apertura, nella lingua corrente; si apre solo se i dati legali sono compilati) -->
  <dialog class="privacy-modal" aria-labelledby="privacy-modal-title">
    <div class="privacy-modal__panel" tabindex="-1"></div>
  </dialog>

  <button class="to-top" type="button" aria-label="Torna su" data-i18n-aria="toTop" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>
  </button>
</body>
</html>
